
name: Build Grok Web IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild \
            -project GrokWeb.xcodeproj \
            -scheme GrokWeb \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GrokWeb.app Payload/
          zip -qry GrokWeb-iOS16.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GrokWeb-iOS16
          path: GrokWeb-iOS16.ipa

